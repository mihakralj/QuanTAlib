name: Deploy Docsify to GitHub Pages

on:
  #push:
  #  branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Explicitly disable Jekyll
          enabler_jekyll: false

      - name: List files (Debug)
        run: ls -R

      - name: Ensure .nojekyll exists in root
        run: |
          if [ ! -f .nojekyll ]; then
            echo "Creating .nojekyll file"
            touch .nojekyll
          else
            echo ".nojekyll already exists"
          fi
          ls -la .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload entire repository so Docsify can access 'lib/' and other root files
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4